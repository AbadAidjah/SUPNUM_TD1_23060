version: '3.8'
services:

  postgres:
    image: postgres:15
    container_name: td1-postgres-soap
    environment:
      POSTGRES_DB: td1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: A@077068
    ports:
      - "5433:5432"  
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data
    networks: 
      - td1-network

  backend:
      build: ./soap/demo
      container_name: td1-backend-soap
      environment:
      
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/td1
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: A@077068
        SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver           
      ports:
        - "8080:8080"
    # command: sh -c "sleep 40 && java -jar /app/target/demo-0.0.1-SNAPSHOT.jar"
      depends_on:
        - postgres
      networks:   
        - td1-network
  middleware:
      build: ./rest-middleware/demo
      container_name: td2-backend-soap-to-rest
      environment:
        SERVER.PORT: 8081
        SOAP.SERVER.URL: http://backend:8080/ws

      
               
      ports:
        - "8081:8081"
    # command: sh -c "sleep 40 && java -jar /app/target/demo-0.0.1-SNAPSHOT.jar"
      # depends_on:
      #   - postgres
      networks:   
        - td1-network

networks:
  td1-network:
    driver: bridge       

